name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate static export
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/images/avatar-2026.jpg
          test -f out/icons/icon-light.svg
          test -f out/icons/icon-dark.svg
          test -f out/resume/sergey-gyach-cv-ru.pdf
          test -f out/resume/sergey-gyach-cv-en.pdf
          test -d out/_next/static
          test -n "$(find out/_next/static -type f -print -quit)"
          rg -q '/_next/static/' out/index.html
          out_kib="$(du -sk out | cut -f1)"
          test "$out_kib" -lt 1048576

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
