name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: sergey-gyach-ru
  CONTAINER_PORT: "3000"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          docker build --pull -t "$IMAGE_NAME:$GITHUB_SHA" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Prepare SSH
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          TIMEWEB_SSH_PORT: ${{ secrets.TIMEWEB_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${TIMEWEB_HOST:?Missing secret TIMEWEB_HOST}"
          : "${TIMEWEB_SSH_KEY:?Missing secret TIMEWEB_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TIMEWEB_SSH_KEY" > ~/.ssh/timeweb_key
          chmod 600 ~/.ssh/timeweb_key
          ssh-keyscan -p "$TIMEWEB_SSH_PORT" -H "$TIMEWEB_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Timeweb
        env:
          TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
          TIMEWEB_USER: ${{ secrets.TIMEWEB_USER }}
          TIMEWEB_SSH_PORT: ${{ secrets.TIMEWEB_SSH_PORT || '22' }}
          TIMEWEB_APP_PORT: ${{ secrets.TIMEWEB_APP_PORT || '3000' }}
          TIMEWEB_BIND_HOST: ${{ secrets.TIMEWEB_BIND_HOST || '127.0.0.1' }}
          TIMEWEB_DOCKER_NETWORK: ${{ secrets.TIMEWEB_DOCKER_NETWORK || 'nodejs-redirect_redirect-network' }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          : "${TIMEWEB_HOST:?Missing secret TIMEWEB_HOST}"
          : "${TIMEWEB_USER:?Missing secret TIMEWEB_USER}"
          : "${IMAGE_NAME:?Missing IMAGE_NAME}"

          ssh -i ~/.ssh/timeweb_key -p "$TIMEWEB_SSH_PORT" "$TIMEWEB_USER@$TIMEWEB_HOST" \
            "APP_NAME='$APP_NAME' APP_PORT='$TIMEWEB_APP_PORT' CONTAINER_PORT='$CONTAINER_PORT' BIND_HOST='$TIMEWEB_BIND_HOST' DOCKER_NETWORK='$TIMEWEB_DOCKER_NETWORK' IMAGE='$IMAGE_NAME:$GITHUB_SHA' REGISTRY_HOST='ghcr.io' REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' HEALTHCHECK_PATH='/api/health' bash -s" \
            < scripts/timeweb-deploy.sh
